<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuis Interaktif Family 100</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="glass-panel">
    <div class="app-title-group">
      <div class="app-title" id="appTitleText" onclick="openTitleModal()" title="Klik untuk ubah judul">
        KUIS FAMILY 100 SMP
      </div>
      <div class="realtime-clock" id="clockDisplay">00:00:00</div>
    </div>

    <div class="header-actions">
      <button class="btn-icon" onclick="toggleLanguage()" id="langBtn">🌐 ID</button>
      <button class="btn-icon" onclick="toggleTheme()" id="themeBtn">🌙 Dark</button>
      <button class="btn-icon" onclick="openCrudModal()" id="crudBtn">⚙️ Soal</button>
    </div>
  </header>
  <main class="game-container">
    
    <div class="scoreboard-row">
      <div class="glass-panel team-card team-a" id="teamACard">
        <div class="team-name" id="teamANameDisplay">
          <span id="teamANameText">TIM A</span>
          <span style="font-size:0.8rem; cursor:pointer;" onclick="editTeamName('A')">✏️</span>
        </div>
        <div class="team-score" id="teamAScore">0</div>
      </div>

      <div class="glass-panel pot-card">
        <div class="pot-label" id="i18nPotLabel">POT POIN RONDE</div>
        <div class="pot-score" id="roundPotScore">0</div>
        <div class="round-badge" id="roundBadge">RONDE 1 / 5</div>
      </div>

      <div class="glass-panel team-card team-b" id="teamBCard">
        <div class="team-name" id="teamBNameDisplay">
          <span id="teamBNameText">TIM B</span>
          <span style="font-size:0.8rem; cursor:pointer;" onclick="editTeamName('B')">✏️</span>
        </div>
        <div class="team-score" id="teamBScore">0</div>
      </div>
    </div>

    <div class="glass-panel status-bar">
      <div class="timer-container">
        <span style="font-size: 1.2rem;">⏱️</span>
        <div class="timer-display" id="timerDisplay">05:00</div>
        <button class="btn-icon" id="timerToggleBtn" onclick="toggleTimer()">▶️️</button>
        <button class="btn-icon" onclick="resetTimer()">🔄</button>
      </div>

      <div class="strike-container">
        <span class="strike-title" id="i18nStrikeTitle">STRIKE:</span>
        <div class="strike-box">
          <div class="strike-x" id="strike1">X</div>
          <div class="strike-x" id="strike2">X</div>
          <div class="strike-x" id="strike3">X</div>
        </div>
      </div>
    </div>

    <div class="turn-banner main-turn" id="turnBanner">
      GILIRAN: <span id="activeTeamNameText">TIM A</span>
    </div>

    <div class="glass-panel question-box" id="questionTextDisplay">
      Memuat Soal...
    </div>

    <div class="board-grid" id="boardGrid">
    </div>

    <form class="input-section" onsubmit="handleAnswerSubmit(event)">
      <input type="text" class="answer-input" id="answerInput" placeholder="Ketik jawaban di sini lalu Tekan Enter..." autocomplete="off">
      <button type="submit" class="btn-submit" id="i18nSubmitBtn">JAWAB</button>
    </form>

    <div class="glass-panel host-control-bar">
      <button class="btn-host" onclick="switchActiveTeam()">🔀 <span id="i18nSwitchTeam">Pindah Tim</span></button>
      <button class="btn-host" onclick="resetStrikesManual()">🧹 <span id="i18nResetStrike">Reset Strike</span></button>
      <button class="btn-host" onclick="nextQuestion()">⏩ <span id="i18nNextQuestion">Pindah Soal</span></button>
      <button class="btn-host" onclick="openQuickAddModal()">➕ <span id="i18nQuickAdd">Tambah Soal</span></button>
      <button class="btn-host danger" onclick="confirmResetGame()">🔄 <span id="i18nResetGame">Reset Game</span></button>
    </div>

  </main>

  <div class="strike-overlay" id="strikeOverlay">
    <div class="big-strike-x">X</div>
  </div>
  <div class="modal-backdrop" id="customConfirmModal">
    <div class="glass-panel modal-content" style="max-width: 480px; text-align: center;">
      <div class="modal-title" id="customConfirmTitle" style="margin-bottom: 15px;">Konfirmasi</div>
      <p id="customConfirmMessage" style="color: var(--text-main); font-size: 1.05rem; margin-bottom: 25px; line-height: 1.5;"></p>
      <div class="modal-actions" style="justify-content: center;">
        <button class="btn-host" onclick="handleConfirmResult(false)" style="padding: 10px 24px;">Batal</button>
        <button class="btn-submit" onclick="handleConfirmResult(true)" style="padding: 10px 24px;">Ya, Lanjutkan</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="customAlertModal">
    <div class="glass-panel modal-content" style="max-width: 450px; text-align: center;">
      <div class="modal-title" id="customAlertTitle" style="margin-bottom: 15px;">Informasi</div>
      <p id="customAlertMessage" style="color: var(--text-main); font-size: 1.05rem; margin-bottom: 25px; line-height: 1.5;"></p>
      <button class="btn-submit" onclick="closeCustomAlert()" style="width: 100%; padding: 12px;">OK</button>
    </div>
  </div>

  <div class="modal-backdrop" id="customPromptModal">
    <div class="glass-panel modal-content" style="max-width: 480px;">
      <div class="modal-header">
        <div class="modal-title" id="customPromptTitle">Ubah Data</div>
        <button class="btn-close" onclick="closeCustomPrompt()">&times;</button>
      </div>
      <form onsubmit="handlePromptSubmit(event)">
        <div class="form-group">
          <input type="text" class="form-control" id="customPromptInput" required style="font-size: 1.1rem; padding: 12px;">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-host" onclick="closeCustomPrompt()">Batal</button>
          <button type="submit" class="btn-submit" style="padding: 10px 24px;">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-backdrop" id="crudModal">
    <div class="glass-panel modal-content">
      <div class="modal-header">
        <div class="modal-title" id="i18nCrudTitle">Manajemen Soal & Jawaban</div>
        <button class="btn-close" onclick="closeCrudModal()">&times;</button>
      </div>
      <div id="crudQuestionList"></div>
      <hr style="border-color: var(--card-border); margin: 20px 0;">
      <button class="btn-submit" style="width:100%; padding: 12px;" onclick="openQuestionForm()">+ Tambah Soal Baru</button>
    </div>
  </div>

  <div class="modal-backdrop" id="formModal">
    <div class="glass-panel modal-content">
      <div class="modal-header">
        <div class="modal-title" id="formModalTitle">Form Soal</div>
        <button class="btn-close" onclick="closeFormModal()">&times;</button>
      </div>
      <form onsubmit="saveQuestionForm(event)">
        <input type="hidden" id="formQId">
        <div class="form-group">
          <label class="form-label">Pertanyaan:</label>
          <input type="text" class="form-control" id="formQPertanyaan" required>
        </div>
        <div class="form-group">
          <label class="form-label">Jawaban & Poin (Maksimal 10 Slot):</label>
          <div id="answerSlotsContainer"></div>
        </div>
        <button type="submit" class="btn-submit" style="width:100%; padding: 12px;">Simpan Soal</button>
      </form>
    </div>
  </div>

  <div class="modal-backdrop" id="titleModal">
    <div class="glass-panel modal-content">
      <div class="modal-header">
        <div class="modal-title">Ubah Judul Aplikasi</div>
        <button class="btn-close" onclick="closeTitleModal()">&times;</button>
      </div>
      <div class="form-group">
        <label class="form-label">Judul Baru:</label>
        <input type="text" class="form-control" id="newAppTitleInput">
      </div>
      <button class="btn-submit" style="width:100%; padding: 12px;" onclick="saveAppTitle()">Simpan Judul</button>
    </div>
  </div>

  <!-- Winner Celebration Modal -->
  <div class="modal-backdrop" id="winnerModal">
    <div class="glass-panel modal-content winner-box">
      <div class="winner-trophy">🏆</div>
      <div class="winner-name" id="winnerText">TIM A MENANG!</div>
      <div class="winner-scores" id="winnerScoresText">Skor Akhir: 250 vs 140</div>
      <button class="btn-submit" style="padding: 12px 30px;" onclick="restartFullGame()">🎮 MAIN LAGI</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
